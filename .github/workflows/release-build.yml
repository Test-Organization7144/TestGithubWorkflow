name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string
        default: "1.0.0"

      tag:
        description: Git tag
        required: true
        type: string
        default: v1.0.0

# Permissions available to the Actions GITHUB_TOKEN.
# Do NOT add "metadata" here. Metadata is a GitHub API/repository
# permission, not a valid Actions workflow permission.
permissions:
  contents: read

concurrency:
  group: release-build-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Create Jira Release
    runs-on: ubuntu-latest

    env:
      # Release information supplied when the workflow is manually run
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}

      # Automatically identifies the repository where this workflow runs.
      # Example:
      # Test-Organization7144/TestGithubWorkflow
      REPOSITORY: ${{ github.repository }}

      # Branch/tag from which the workflow was manually started.
      # Example:
      # main
      REF: ${{ github.ref_name }}

      # Jira configuration
      JIRA_URL: https://ranjith-kumar-a.atlassian.net

    steps:

      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Display release information
      # ------------------------------------------------------------
      - name: Show release information
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Release Build"
          echo "========================================"
          echo "Repository : ${REPOSITORY}"
          echo "Version    : ${VERSION}"
          echo "Tag        : ${TAG}"
          echo "REF        : ${REF}"
          echo "GitHub Ref : ${{ github.ref }}"
          echo "Ref Type   : ${{ github.ref_type }}"
          echo "Commit SHA : ${{ github.sha }}"
          echo "========================================"

      # ------------------------------------------------------------
      # 3. Set up Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # 4. Install Python dependencies
      #
      # No PyYAML is required anymore because jira-projects.yml
      # is no longer being used.
      # ------------------------------------------------------------
      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "requests>=2.32,<3"

      # ------------------------------------------------------------
      # 5. Read GitHub Custom Properties and create Jira releases
      #
      # create_release.py reads:
      #
      #   jira_projects
      #   workflows
      #
      # directly from:
      #
      # GET /repos/{owner}/{repo}/properties/values
      #
      # GITHUB_TOKEN is the automatically generated GitHub Actions
      # token for this repository.
      # ------------------------------------------------------------
      - name: Create Jira releases
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          # Use the automatically generated Actions token.
          GITHUB_TOKEN: ${{ github.token }}

        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Starting Jira release creation"
          echo "========================================"
          echo "Repository: ${REPOSITORY}"
          echo "Version   : ${VERSION}"
          echo "Tag       : ${TAG}"
          echo "REF       : ${REF}"
          echo "========================================"

          python create_release.py
