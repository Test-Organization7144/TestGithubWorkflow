name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Jira release version
        required: true
        type: string
        default: "1.0.0"

      tag:
        description: Git tag for the release
        required: true
        type: string
        default: "v1.0.0"

      ref:
        description: Branch or existing tag to deploy from
        required: true
        type: string
        default: "main"

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Create Jira Release
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      REPOSITORY: ${{ github.repository }}
      REF: ${{ inputs.ref }}
      JIRA_URL: https://ranjith-kumar-a.atlassian.net

    steps:

      # ---------------------------------------------------------------
      # 1. Checkout the workflow source
      #
      # The workflow source is determined by the ref selected when
      # manually starting the workflow.
      # ---------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2. Show release information
      # ---------------------------------------------------------------

      - name: Show release information
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "Release Build"
          echo "================================================"

          echo "Repository        : ${REPOSITORY}"
          echo "Version           : ${VERSION}"
          echo "Tag               : ${TAG}"
          echo "Deployment REF    : ${REF}"

          echo "Workflow Source   : ${{ github.ref_name }}"
          echo "GitHub Ref        : ${{ github.ref }}"
          echo "Ref Type          : ${{ github.ref_type }}"
          echo "Commit SHA        : ${{ github.sha }}"

          echo "================================================"

      # ---------------------------------------------------------------
      # 3. Validate deployment REF
      #
      # Supports branches and existing tags, including names containing
      # slashes, such as release/1.0.0.
      # ---------------------------------------------------------------

      - name: Validate deployment REF
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "================================================"
          echo "Validating deployment REF"
          echo "================================================"

          echo "Repository : ${REPOSITORY}"
          echo "REF        : ${REF}"

          if [[ -z "${REF//[[:space:]]/}" ]]; then
            echo "ERROR: Deployment REF cannot be empty."
            exit 1
          fi

          if [[ "${REF}" == refs/heads/* ]]; then
            REF="${REF#refs/heads/}"
          elif [[ "${REF}" == refs/tags/* ]]; then
            REF="${REF#refs/tags/}"
          fi

          if [[ "${REF}" == -* ]]; then
            echo "ERROR: Deployment REF must not begin with '-'."
            exit 1
          fi

          if gh api \
            "repos/${REPOSITORY}/git/ref/heads/${REF}" \
            >/dev/null 2>&1; then

            echo "SUCCESS: REF '${REF}' exists as a branch."

          elif gh api \
            "repos/${REPOSITORY}/git/ref/tags/${REF}" \
            >/dev/null 2>&1; then

            echo "SUCCESS: REF '${REF}' exists as a tag."

          else
            echo "ERROR: REF '${REF}' was not found as a branch or tag."
            echo "Check the deployment REF and repository permissions."
            exit 1
          fi

          echo "================================================"

      # ---------------------------------------------------------------
      # 4. Set up Python
      # ---------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------------
      # 5. Install Python dependencies directly
      #
      # No requirements.txt or pyproject.toml is required.
      # ---------------------------------------------------------------

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "Installing Python dependencies"
          echo "================================================"

          python --version
          python -m pip install --upgrade pip
          python -m pip install "requests>=2.32,<3"

          echo "SUCCESS: Python dependencies installed."

      # ---------------------------------------------------------------
      # 6. Diagnose release configuration
      #
      # Detects missing scripts and Python syntax errors before the
      # Jira release creation step is executed.
      # ---------------------------------------------------------------

      - name: Diagnose release configuration
        shell: bash
        env:
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SOURCE_NAME: ${{ github.ref_name }}
          WORKFLOW_SOURCE_TYPE: ${{ github.ref_type }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "================================================"
          echo "Release Build Diagnostics"
          echo "================================================"

          echo "Repository           : ${REPOSITORY}"
          echo "Requested Version    : ${VERSION}"
          echo "Requested Tag        : ${TAG}"
          echo "Deployment REF       : ${REF}"
          echo "Workflow Source Ref  : ${WORKFLOW_SOURCE_REF}"
          echo "Workflow Source Name : ${WORKFLOW_SOURCE_NAME}"
          echo "Workflow Source Type : ${WORKFLOW_SOURCE_TYPE}"
          echo "Workflow Source SHA  : ${WORKFLOW_SOURCE_SHA}"
          echo "Checked-out Commit   : $(git rev-parse HEAD)"
          echo "Current Directory    : $(pwd)"

          echo "------------------------------------------------"
          echo "Checking repository files"
          echo "------------------------------------------------"

          echo "Root directory contents:"
          ls -la

          echo "------------------------------------------------"
          echo "Checking create_release.py"
          echo "------------------------------------------------"

          if [[ -f "create_release.py" ]]; then
            echo "SUCCESS: create_release.py exists."
            echo "Script path: $(realpath create_release.py)"
          else
            echo "ERROR: create_release.py was not found in the repository root."
            echo "Possible causes:"
            echo "1. The workflow source branch or tag is outdated."
            echo "2. The script has not been committed to this ref."
            echo "3. The script is stored in a different directory."
            echo "Jira release creation will not be attempted."
            exit 1
          fi

          echo "------------------------------------------------"
          echo "Checking Python syntax"
          echo "------------------------------------------------"

          if python -m py_compile create_release.py; then
            echo "SUCCESS: Python syntax validation passed."
          else
            echo "ERROR: create_release.py contains a Python syntax error."
            echo "Fix the script before attempting Jira release creation."
            exit 1
          fi

          echo "------------------------------------------------"
          echo "Checking required Python dependency"
          echo "------------------------------------------------"

          if python -c "import requests; print('requests version:', requests.__version__)"; then
            echo "SUCCESS: requests is available."
          else
            echo "ERROR: requests could not be imported."
            exit 1
          fi

          echo "================================================"
          echo "Diagnostics completed successfully."
          echo "Proceeding to Jira release creation."
          echo "================================================"

      # ---------------------------------------------------------------
      # 7. Create Jira releases
      #
      # GitHub Custom Properties are read by create_release.py.
      #
      # Required properties:
      #   jira_projects
      #   workflow
      #
      # Optional property:
      #   deployment_type
      #
      # If deployment_type is not configured, the script should default
      # to direct deployment for backward compatibility.
      #
      # Direct example:
      #   deployment_type = direct
      #   workflow = uat=uatdeploy.yml|prod=proddeploy.yml
      #
      # Template example:
      #   deployment_type = template
      #   workflow = dev=non-prod.yml|test=non-prod.yml|uat=non-prod.yml
      # ---------------------------------------------------------------

      - name: Create Jira releases
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "Starting Jira release creation"
          echo "================================================"

          echo "Repository : ${REPOSITORY}"
          echo "Version    : ${VERSION}"
          echo "Tag        : ${TAG}"
          echo "REF        : ${REF}"
          echo "Jira URL   : ${JIRA_URL}"

          echo "================================================"

          python create_release.py

          echo "================================================"
          echo "Jira release creation step completed."
          echo "================================================"
