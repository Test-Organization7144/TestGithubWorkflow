name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string
        default: "1.0.0"

      tag:
        description: Git tag
        required: true
        type: string
        default: v1.0.0

permissions:
  contents: read
  metadata: read

concurrency:
  group: release-build-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Create Jira Release
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      REPOSITORY: ${{ github.repository }}

      # Branch/tag selected in the GitHub Actions Run workflow screen.
      # Examples:
      # main
      # develop
      # release/1.0.1
      # v1.0.1
      REF: ${{ github.ref_name }}

      JIRA_URL: https://ranjith-kumar-a.atlassian.net

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show selected Git ref
        run: |
          echo "========================================"
          echo "GitHub Ref Information"
          echo "========================================"
          echo "Selected ref     : ${{ github.ref }}"
          echo "Selected ref name: ${{ github.ref_name }}"
          echo "Selected ref type: ${{ github.ref_type }}"
          echo "Release REF      : ${REF}"
          echo "Repository       : ${REPOSITORY}"
          echo "========================================"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "requests>=2.32,<3"

      - name: Create Jira releases
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python create_release.py
