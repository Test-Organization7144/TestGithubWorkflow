name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string
        default: "1.0.0"

      tag:
        description: Git tag
        required: true
        type: string
        default: v1.0.0

      environment:
        description: Deployment environment
        required: true
        type: string
        default: test

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Create Jira Release
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      ENVIRONMENT: ${{ inputs.environment }}
      REPOSITORY: ${{ github.repository }}

      # Exact branch/tag selected when Run workflow is executed
      REF: ${{ github.ref }}

      JIRA_URL: https://ranjith-kumar-a.atlassian.net

      CONFIG_REPO: ranjithk0706/github-deployment-config
      CONFIG_FILE: jira-projects.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # TEMPORARY DEBUG STEP
      - name: Show selected Git ref
        run: |
          echo "========================================"
          echo "GitHub Ref Information"
          echo "========================================"
          echo "Selected ref     : ${{ github.ref }}"
          echo "Selected ref name: ${{ github.ref_name }}"
          echo "Selected ref type: ${{ github.ref_type }}"
          echo "========================================"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3" "PyYAML>=6,<7"

      - name: Create Jira Release
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          python create_release.py
