name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string
        default: "1.0.0"

      tag:
        description: Release tag
        required: true
        type: string
        default: "v1.0.0"

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Create Jira Release
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      REPOSITORY: ${{ github.repository }}

      # The release tag is always the REF stored in Jira.
      #
      # New release:
      #   Workflow run ref = v1.2.0
      #   TAG              = v1.2.0
      #   REF              = v1.2.0
      #
      # Existing release:
      #   Workflow run ref = main
      #   TAG              = v1.0.0
      #   REF              = v1.0.0
      REF: ${{ inputs.tag }}

      JIRA_URL: https://ranjith-kumar-a.atlassian.net

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      #
      # IMPORTANT:
      #
      # GitHub automatically checks out the ref selected in the
      # "Run workflow" Branch/tag selector.
      #
      # New release:
      #   Select v1.2.0
      #
      # Existing release:
      #   Select main
      #
      # The release TAG itself is controlled independently through
      # the "tag" input.
      #
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Display release information
      # ---------------------------------------------------------
      - name: Show release information
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Release Build"
          echo "========================================"
          echo "Repository        : ${REPOSITORY}"
          echo "Version           : ${VERSION}"
          echo "Release Tag       : ${TAG}"
          echo "Jira REF          : ${REF}"
          echo "Workflow Run Ref  : ${{ github.ref_name }}"
          echo "GitHub Ref        : ${{ github.ref }}"
          echo "Ref Type          : ${{ github.ref_type }}"
          echo "Commit SHA        : ${{ github.sha }}"
          echo "========================================"

      # ---------------------------------------------------------
      # 3. Validate that the requested release tag exists
      # ---------------------------------------------------------
      #
      # This protects against accidentally creating Jira metadata
      # for a tag that does not exist.
      #
      # It works for both:
      #
      #   New tag:
      #       v1.2.0 exists and workflow is running from v1.2.0
      #
      #   Existing tag:
      #       workflow is running from main
      #       TAG=v1.0.0
      #       v1.0.0 is checked here
      #
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking release tag: ${TAG}"

          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo ""
            echo "ERROR: Release tag '${TAG}' does not exist in the repository."
            echo ""
            echo "For a new release:"
            echo "  1. Create and push the tag."
            echo "  2. Select that tag in the GitHub Branch/tag selector."
            echo "  3. Run this workflow."
            echo ""
            echo "For an existing release:"
            echo "  1. Select main as the workflow ref."
            echo "  2. Enter the existing tag as the Tag input."
            echo ""
            exit 1
          fi

          echo "Release tag '${TAG}' exists."

      # ---------------------------------------------------------
      # 4. Set up Python
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # 5. Install dependencies
      # ---------------------------------------------------------
      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "requests>=2.32,<3"

      # ---------------------------------------------------------
      # 6. Create Jira releases
      # ---------------------------------------------------------
      - name: Create Jira releases
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Starting Jira release creation"
          echo "========================================"
          echo "Repository : ${REPOSITORY}"
          echo "Version    : ${VERSION}"
          echo "Tag        : ${TAG}"
          echo "REF        : ${REF}"
          echo "========================================"

          python create_release.py
