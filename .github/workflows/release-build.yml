name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string
        default: "1.0.0"

      tag:
        description: Git tag
        required: true
        type: string
        default: v1.0.0

      environment:
        description: Deployment environment
        required: true
        type: string
        default: test

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Create Jira Release
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      ENVIRONMENT: ${{ inputs.environment }}
      REPOSITORY: ${{ github.repository }}

      # Captures the exact branch or tag selected in GitHub
      REF: ${{ github.ref }}

      JIRA_URL: https://ranjith-kumar-a.atlassian.net
      CONFIG_REPO: ranjithk0706/github-deployment-config
      CONFIG_FILE: jira-projects.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Jira project configuration
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${CONFIG_REPO_TOKEN}" ]] || {
            echo "::error::CONFIG_REPO_TOKEN secret is not configured."
            exit 1
          }

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --header "Authorization: Bearer ${CONFIG_REPO_TOKEN}" \
            --header "Accept: application/vnd.github.raw+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${CONFIG_REPO}/contents/${CONFIG_FILE}" \
            --output "${CONFIG_FILE}"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "requests>=2.32,<3" "PyYAML>=6.0,<7"

      - name: Create Jira releases
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python create_release.py
