name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string
        default: "1.0.0"

      tag:
        description: Git tag
        required: true
        type: string
        default: v1.0.0

      environment:
        description: Deployment environment
        required: true
        type: string
        default: test

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Create Jira Release
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      ENVIRONMENT: ${{ inputs.environment }}
      REPOSITORY: ${{ github.repository }}

      # Exact branch/tag selected in GitHub Actions
      REF: ${{ github.ref }}

      JIRA_URL: https://ranjith-kumar-a.atlassian.net
      CONFIG_REPO: ranjithk0706/github-deployment-config
      CONFIG_FILE: jira-projects.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show selected Git ref
        run: |
          echo "========================================"
          echo "GitHub Ref Information"
          echo "========================================"
          echo "Selected ref     : ${{ github.ref }}"
          echo "Selected ref name: ${{ github.ref_name }}"
          echo "Selected ref type: ${{ github.ref_type }}"
          echo "========================================"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Jira project configuration
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${CONFIG_REPO_TOKEN}" ]] || {
            echo "::error::CONFIG_REPO_TOKEN secret is not configured."
            exit 1
          }

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --header "Authorization: Bearer ${CONFIG_REPO_TOKEN}" \
            --header "Accept: application/vnd.github.raw+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${CONFIG_REPO}/contents/${CONFIG_FILE}" \
            --output "${CONFIG_FILE}"

      - name: Verify downloaded Jira configuration
        shell: bash
        run: |
          echo "========================================"
          echo "Jira Project Configuration"
          echo "========================================"
          cat "${CONFIG_FILE}"
          echo "========================================"

      - name: Verify release script
        shell: bash
        run: |
          echo "========================================"
          echo "Release Script Verification"
          echo "========================================"

          echo "WORKFLOW references:"
          grep -n "WORKFLOW" create_release.py || true

          echo ""
          echo "REF references:"
          grep -n "REF" create_release.py || true

          echo ""
          echo "Environment values:"
          echo "VERSION     = ${VERSION}"
          echo "TAG         = ${TAG}"
          echo "ENVIRONMENT = ${ENVIRONMENT}"
          echo "REPOSITORY  = ${REPOSITORY}"
          echo "REF         = ${REF}"

          echo "========================================"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "requests>=2.32,<3" "PyYAML>=6.0,<7"
# ---------------------------------------------------------------
      # Diagnose release configuration
      #
      # Detects missing scripts and Python syntax errors before the
      # Jira release creation step is executed.
      # ---------------------------------------------------------------

      - name: Diagnose release configuration
        shell: bash
        env:
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SOURCE_NAME: ${{ github.ref_name }}
          WORKFLOW_SOURCE_TYPE: ${{ github.ref_type }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "================================================"
          echo "Release Build Diagnostics"
          echo "================================================"

          echo "Repository           : ${REPOSITORY}"
          echo "Requested Version    : ${VERSION}"
          echo "Requested Tag        : ${TAG}"
          echo "Deployment REF       : ${REF}"
          echo "Workflow Source Ref  : ${WORKFLOW_SOURCE_REF}"
          echo "Workflow Source Name : ${WORKFLOW_SOURCE_NAME}"
          echo "Workflow Source Type : ${WORKFLOW_SOURCE_TYPE}"
          echo "Workflow Source SHA  : ${WORKFLOW_SOURCE_SHA}"
          echo "Checked-out Commit   : $(git rev-parse HEAD)"
          echo "Current Directory    : $(pwd)"

          echo "------------------------------------------------"
          echo "Checking repository files"
          echo "------------------------------------------------"

          echo "Root directory contents:"
          ls -la

          echo "------------------------------------------------"
          echo "Checking create_release.py"
          echo "------------------------------------------------"

          if [[ -f "create_release.py" ]]; then
            echo "SUCCESS: create_release.py exists."
            echo "Script path: $(realpath create_release.py)"
          else
            echo "ERROR: create_release.py was not found in the repository root."
            echo "Possible causes:"
            echo "1. The workflow source branch or tag is outdated."
            echo "2. The script has not been committed to this ref."
            echo "3. The script is stored in a different directory."
            echo "Jira release creation will not be attempted."
            exit 1
          fi

          echo "------------------------------------------------"
          echo "Checking Python syntax"
          echo "------------------------------------------------"

          if python -m py_compile create_release.py; then
            echo "SUCCESS: Python syntax validation passed."
          else
            echo "ERROR: create_release.py contains a Python syntax error."
            echo "Fix the script before attempting Jira release creation."
            exit 1
          fi

          echo "------------------------------------------------"
          echo "Checking required Python dependency"
          echo "------------------------------------------------"

          if python -c "import requests; print('requests version:', requests.__version__)"; then
            echo "SUCCESS: requests is available."
          else
            echo "ERROR: requests could not be imported."
            exit 1
          fi

          echo "================================================"
          echo "Diagnostics completed successfully."
          echo "Proceeding to Jira release creation."
          echo "================================================"

      # ---------------------------------------------------------------

      - name: Create Jira releases
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python create_release.py
