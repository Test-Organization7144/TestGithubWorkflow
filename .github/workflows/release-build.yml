name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string
        default: "1.0.0"

      tag:
        description: Git tag
        required: true
        type: string
        default: v1.0.0

permissions:
  contents: read
  metadata: read

concurrency:
  group: release-build-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Create Jira Release
    runs-on: ubuntu-latest

    env:
      # Release information
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}

      # Automatically gets:
      # Test-Organization7144/TestGithubWorkflow
      #
      # No repository name needs to be hardcoded.
      REPOSITORY: ${{ github.repository }}

      # Branch/tag selected from the GitHub Actions
      # "Run workflow" screen.
      #
      # Examples:
      # main
      # develop
      # release/1.0.1
      # v1.0.1
      REF: ${{ github.ref_name }}

      # Jira
      JIRA_URL: https://ranjith-kumar-a.atlassian.net

    steps:

      # ---------------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2. Display release information
      # ---------------------------------------------------------------
      - name: Show release information
        shell: bash
        run: |
          echo "========================================"
          echo "Release Build"
          echo "========================================"
          echo "Repository : ${REPOSITORY}"
          echo "Version    : ${VERSION}"
          echo "Tag        : ${TAG}"
          echo "REF        : ${REF}"
          echo "GitHub Ref : ${{ github.ref }}"
          echo "Ref Type   : ${{ github.ref_type }}"
          echo "========================================"

      # ---------------------------------------------------------------
      # 3. Set up Python
      # ---------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------------
      # 4. Install Python dependencies
      # ---------------------------------------------------------------
      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "requests>=2.32,<3"

      # ---------------------------------------------------------------
      # 5. Create Jira releases
      # ---------------------------------------------------------------
      - name: Create Jira releases
        env:
          # Jira credentials
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          # GitHub automatically provides this token.
          # create_release.py uses it to read:
          #
          #   jira_projects
          #   workflows
          #
          # from the repository custom properties.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Starting Jira release creation"
          echo "========================================"

          python create_release.py
