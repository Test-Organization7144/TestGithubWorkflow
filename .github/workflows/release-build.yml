name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Jira release version
        required: true
        type: string
        default: "1.0.0"
      tag:
        description: Git tag to associate with the Jira release
        required: true
        type: string
        default: "v1.0.0"
      ref:
        description: Source branch or existing tag to associate with this release
        required: true
        type: string
        default: "main"

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Create Jira Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      REPOSITORY: ${{ github.repository }}
      REF: ${{ inputs.ref }}
      JIRA_URL: https://ranjith-kumar-a.atlassian.net

    steps:
      # Run the workflow code from the branch or tag selected in the Actions UI.
      - name: Checkout workflow source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Reject invalid release metadata before making API calls.
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]] || {
            echo "::error::Invalid version '${VERSION}'."
            exit 1
          }
          git check-ref-format "refs/tags/${TAG}" || {
            echo "::error::Invalid Git tag name '${TAG}'."
            exit 1
          }
          if ! git check-ref-format "refs/heads/${REF}" && ! git check-ref-format "refs/tags/${REF}"; then
            echo "::error::Invalid source ref '${REF}'."
            exit 1
          fi

      # Resolve branch or tag names to an immutable commit SHA, including annotated tags.
      - name: Validate and resolve source ref
        id: source-ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://github.com/${REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"

          matches="$(git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" ls-remote origin \
            "refs/heads/${REF}" \
            "refs/tags/${REF}" \
            "refs/tags/${REF}^{}")"

          branch_sha="$(awk -v ref="refs/heads/${REF}" '$2 == ref {print $1; exit}' <<< "${matches}")"
          tag_sha="$(awk -v ref="refs/tags/${REF}" '$2 == ref "^{}" {peeled=$1} $2 == ref {tag=$1} END {if (peeled != "") print peeled; else if (tag != "") print tag}' <<< "${matches}")"

          if [[ -n "${branch_sha}" && -n "${tag_sha}" ]]; then
            echo "::error::'${REF}' exists as both a branch and a tag; use a unique name."
            exit 1
          elif [[ -n "${branch_sha}" ]]; then
            source_type="branch"
            source_sha="${branch_sha}"
          elif [[ -n "${tag_sha}" ]]; then
            source_type="tag"
            source_sha="${tag_sha}"
          else
            echo "::error::Source ref '${REF}' was not found in ${REPOSITORY}."
            exit 1
          fi

          echo "source_type=${source_type}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "Source ref : ${REF}"
          echo "Ref type   : ${source_type}"
          echo "Commit SHA : ${source_sha}"

      # Print both the workflow's own revision and the release source revision for traceability.
      - name: Show release context
        shell: bash
        env:
          SOURCE_TYPE: ${{ steps.source-ref.outputs.source_type }}
          SOURCE_SHA: ${{ steps.source-ref.outputs.source_sha }}
        run: |
          set -euo pipefail
          echo "Repository          : ${REPOSITORY}"
          echo "Jira version        : ${VERSION}"
          echo "Release tag         : ${TAG}"
          echo "Release source ref  : ${REF}"
          echo "Release source type : ${SOURCE_TYPE}"
          echo "Release source SHA  : ${SOURCE_SHA}"
          echo "Workflow ref        : ${{ github.ref }}"
          echo "Workflow commit SHA : ${{ github.sha }}"

      # Use a fixed Python runtime for consistent execution across manual runs.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Install only the HTTP client required by the Jira and GitHub API calls.
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "requests>=2.32,<3"

      # Verify that the selected workflow ref contains the expected release script.
      - name: Diagnose release script version
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Release script diagnostics"
          echo "========================================"
          echo "Repository       : ${GITHUB_REPOSITORY}"
          echo "Workflow ref     : ${GITHUB_REF}"
          echo "Workflow SHA     : ${GITHUB_SHA}"
          echo "Checked-out SHA  : $(git rev-parse HEAD)"
          echo "Release source   : ${REF}"
          echo "Python script    : $(realpath create_release.py)"

          echo "Checking for the old error message..."
          if grep -nF "is not configured." create_release.py; then
            echo "::warning::The checked-out script may contain the old validation."
          else
            echo "The old error text was not found in create_release.py."
          fi

          echo "Checking required validation..."
          if grep -nF "Release configuration could not be resolved" create_release.py; then
            echo "Updated validation text is present."
          else
            echo "::error::Updated validation is missing from the checked-out script."
            exit 1
          fi

      # Read repository custom properties and create the release in each configured Jira project.
      - name: Create Jira releases
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python create_release.py
